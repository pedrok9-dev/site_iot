<svg viewBox="0 0 420 560" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d67a"/>
      <stop offset="1" stop-color="#e0b94a"/>
    </linearGradient>
  </defs>

  <!-- Corpo do multimetro -->
  <rect x="40" y="20" width="340" height="440" rx="26" fill="url(#g)" stroke="#2b2b2b" stroke-width="4"/>
  <rect x="58" y="38" width="304" height="404" rx="18" fill="#3a3f33" stroke="#2b2b2b" stroke-width="3"/>

  <!-- Tela LCD -->
  <rect x="82" y="60" width="256" height="92" rx="8" fill="#b9c9a8" stroke="#2b2b2b" stroke-width="3"/>
  <text x="310" y="88" font-family="monospace" font-size="20" fill="#2b2b2b" text-anchor="end">DC V</text>
  <text x="320" y="135" font-family="monospace" font-size="46" font-weight="bold" fill="#1c1c1c" text-anchor="end">4.98</text>

  <!-- Botao liga/desliga -->
  <circle cx="310" cy="185" r="14" fill="#c0392b" stroke="#2b2b2b" stroke-width="2"/>

  <!-- Dial rotativo -->
  <circle cx="210" cy="250" r="82" fill="#e8e8e0" stroke="#2b2b2b" stroke-width="4"/>
  <circle cx="210" cy="250" r="14" fill="#555" stroke="#2b2b2b" stroke-width="2"/>

  <!-- Ponteiro do dial apontando para DCV 20 -->
  <g stroke="#2b2b2b" stroke-width="6" stroke-linecap="round">
    <line x1="210" y1="250" x2="210" y2="185"/>
  </g>

  <!-- Marcacoes do dial (posicoes de medicao) -->
  <g font-family="monospace" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <text x="210" y="178">20</text>
    <text x="150" y="200">200m</text>
    <text x="270" y="200">200</text>
    <text x="130" y="255">OFF</text>
    <text x="290" y="255">750V~</text>
    <text x="150" y="315">200μ</text>
    <text x="270" y="315">2A</text>
    <text x="210" y="335">Ω</text>
  </g>
  <text x="210" y="270" font-family="monospace" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold">V⎓</text>

  <!-- Entradas das pontas de prova -->
  <circle cx="150" cy="400" r="14" fill="#1c1c1c" stroke="#2b2b2b" stroke-width="2"/>
  <text x="150" y="425" font-family="monospace" font-size="11" fill="#ddd" text-anchor="middle">COM</text>
  <circle cx="270" cy="400" r="14" fill="#1c1c1c" stroke="#2b2b2b" stroke-width="2"/>
  <text x="270" y="425" font-family="monospace" font-size="11" fill="#ddd" text-anchor="middle">VΩmA</text>

  <!-- Pontas de prova -->
  <g stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M150 400 q -60 40 -70 110" stroke="#1c1c1c"/>
    <path d="M270 400 q 60 40 70 110" stroke="#c0392b"/>
  </g>
  <rect x="60" y="500" width="50" height="14" rx="6" fill="#1c1c1c" transform="rotate(35 70 510)"/>
  <circle cx="72" cy="515" r="9" fill="#1c1c1c"/>
  <circle cx="348" cy="515" r="9" fill="#c0392b"/>
</svg>